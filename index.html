<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <title>Calculator</title>
</head>
<body>
    <div class="main">
        <div class="display-container">
            <p id="history" class="history-text">0</p>
            <p id="result" class="result-text">0</p>
        </div>
        
        <div class="correction-layer">
            <div class="spacer"></div>
            <button data-value="del" data-type="delete" class="btn-del">⌫</button>
        </div>

        <div id="keypad" class="btns">
            <button data-type="clear" class="btn-clear">C</button>
            <button data-value="sqrt" data-type="operator" class="btn-func">√</button>
            <button data-value="**" data-type="operator" class="btn-func">x²</button>
            <button data-value="%" data-type="operator" class="btn-op">%</button>

            <button data-value="7" data-type="number">7</button>
            <button data-value="8" data-type="number">8</button>
            <button data-value="9" data-type="number">9</button>
            <button data-value="÷" data-type="operator" class="btn-op">÷</button>

            <button data-value="4" data-type="number">4</button>
            <button data-value="5" data-type="number">5</button>
            <button data-value="6" data-type="number">6</button>
            <button data-value="x" data-type="operator" class="btn-op">x</button>

            <button data-value="1" data-type="number">1</button>
            <button data-value="2" data-type="number">2</button>
            <button data-value="3" data-type="number">3</button>
            <button data-value="-" data-type="operator" class="btn-op">-</button>

            <button data-value="." data-type="number">.</button>
            <button data-value="0" data-type="number">0</button>
            <button data-type="equals" class="btn-equals">=</button>
            <button data-value="+" data-type="operator" class="btn-op">+</button>
        </div> 
    </div>
    <script src="main.js"></script>
</body>
</html>
